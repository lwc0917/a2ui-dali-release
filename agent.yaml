apiVersion: agenthub/v1
id: a2ui-dali-release
name: a2ui-dali Release
version: 1.0.0
description: dali-ui 에 새 릴리스 태그가 생기면 격리 DALi 스택을 재빌드하고, a2ui-dali 렌더러를 빌드(깨지면 Claude 가 코드 적응) 후 갤러리 코퍼스 36종을 이전 릴리스 렌더와 비교. 심각한 시각 훼손이 없으면 github.com/dalihub/a2ui-dali 로 자동 릴리스(버전 범프+태그+push). 결과 리포트(이미지 포함)는 run 페이지에서 확인. 새 태그가 없으면 no-op.
owner: uifw
capabilities: [release-check, build, verify, release]
tags: [real, long-running]

# 완전 자동 릴리스 (public repo push) — 품질은 3중 게이트가 fail-closed 로 보증:
#  conformance 전수 통과 + 픽셀 회귀(mean-abs-diff) + Claude 시각 판정(기본값 DAMAGED=차단).
confirm_before_run: false
# 단일 워크스페이스 + 수십 분 스택 빌드 → 동시 실행 금지.
single_flight: true

# Run 폼/API 인자 — 시각 게이트를 얼마나 빡세게 볼지 실행 시점에 지정.
inputs:
  - name: gate_level
    type: enum
    choices: ["strict", "normal", "lenient"]
    default: "normal"
    description: "시각 게이트 강도. strict=사람 눈에 띄는 변화면 차단(탐지 0.02) / normal=구조 훼손(겹침·미렌더·잘림)만 차단(0.05) / lenient=치명 파손(빈 화면·전면 미렌더)만 차단(0.30)"
  - name: diff_threshold
    type: string
    required: false
    description: "픽셀 탐지 임계값 직접 지정 (mean-abs-diff 0~255 스케일, 예: 0.10) — 비우면 gate_level 의 기본값"
  - name: dry_run
    type: bool
    default: false
    description: "리허설 — 게이트까지 전부 수행하되 커밋/태그/push/baseline/ledger 는 변경하지 않음"
  - name: force_accept
    type: string
    required: false
    description: "게이트 RED 1회 수동 승인 — 승인할 '정확한 dali-ui 태그'(예: v2.5.29.10863)를 입력. 리포트의 실패 타깃과 일치할 때만 1회 적용되고, 포괄값(true/1)이나 다른 태그는 무시(차단)된다. 이전 실패 리포트의 side-by-side 이미지를 사람이 확인한 뒤에만 사용."

runner:
  type: subprocess
  command: ["bash", "automation/run.sh"]
  cwd: "."
  env_from_inputs:
    GATE_LEVEL: "${input.gate_level}"
    DIFF_THRESHOLD_INPUT: "${input.diff_threshold}"
    DRY_RUN_INPUT: "${input.dry_run}"
    FORCE_ACCEPT_INPUT: "${input.force_accept}"
  # dali-core/adaptor/ui 3종 풀빌드 + 36종 렌더 + Claude 적응 루프 → 여유 있게 3시간.
  timeout_seconds: 10800
  logs:
    mode: stdout
    step_patterns:
      - { event: step,  regex: "^\\[step\\]\\s+(?P<name>.+)$" }
      - { event: error, regex: "^\\s*\\[ERROR\\]\\s*(?P<msg>.+)" }
  result:
    # stdout_tail(40줄 캡) 대신 파일 — 리포트 전문이 잘리지 않고, 실패 시에도 읽힘.
    mode: file
    path: workspace/last_report.md
    content_type: "text/markdown"
  success:
    mode: exit_zero
